name: Offline regression tests
on: [push, pull_request]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -c requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          TRADER_OFFLINE: 'true'
      - run: node --test tests/*.test.cjs
  cpu-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -c requirements-lock.txt
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e './forecasting[kronos,test]' -c requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          TRADER_OFFLINE: 'true'
      - run: python -m pytest -q
        working-directory: forecasting
        env:
          HF_HUB_OFFLINE: '1'
      - run: node --test forecasting/tests/*.js forecasting/tests/*.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -c requirements-lock.txt
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e './forecasting[kronos]' -c requirements-lock.txt
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_smoke.cjs
        env:
          TRADER_OFFLINE: 'true'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg TRAINER_DEVICE=cpu -t candle-route-smoke .
      - run: |
          docker run -d --name candle-route-smoke -p 127.0.0.1:8011:8011 -e TRADER_OFFLINE=true candle-route-smoke
          curl --fail --retry 20 --retry-connrefused http://127.0.0.1:8011/healthz
          docker exec candle-route-smoke python -c 'from crypto_forecast.dashboard import JobManager'
      - if: always()
        run: docker rm -f candle-route-smoke
